<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Radar — Capture Board (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ── Cohere(white editorial) 토큰 — DESIGN.md ── */
  :root{
    --near:#17171c; --green:#003c33; --blue:#1863dc; --coral:#ff7759; --soft-coral:#ffad9b;
    --white:#fff; --stone:#eeece7; --elevated:#f6f5f2; --pale-green:#edfce9; --pale-blue:#f1f5ff;
    --ink:#212121; --muted:#93939f; --slate:#75758a; --hair:#d9d9dd; --border:#e5e7eb;
    --font-display:"Space Grotesk","Inter",ui-sans-serif,system-ui;
    --font-body:"Inter",ui-sans-serif,system-ui;
    --font-mono:"Space Mono",ui-monospace,monospace;
    --q1:#ff7759; --q2:#003c33; --q3:#1863dc; --q4:#93939f; --q0:#c9c7c0;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-body); color:var(--ink); background:var(--white);
    overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none;
  }
  .app{display:flex; flex-direction:column; height:100vh}

  /* 헤더 */
  .head{display:flex; align-items:baseline; justify-content:space-between;
    padding:14px 22px 6px; flex:0 0 auto}
  .head .mark{font:600 13px var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink)}
  .head .hint{font:400 11px var(--font-mono); color:var(--muted)}
  .head .hint b{color:var(--ink); font-weight:700}

  /* 보드 = 3컬럼 (inbox | matrix | execute) */
  .board{flex:1; min-height:0; display:flex; gap:14px; padding:8px 16px 14px}
  .canvas{flex:1; min-width:0; position:relative; display:flex; gap:16px}

  .col-label{position:absolute; top:12px; left:14px; z-index:2; pointer-events:none;
    display:flex; align-items:center; gap:7px}
  .col-label .tag{font:700 10px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--slate)}
  .col-label .ko{font:500 11px var(--font-body); color:var(--muted)}
  .col-label .count{font:700 10px var(--font-mono); padding:1px 7px; border-radius:999px;
    background:var(--stone); color:var(--slate)}

  /* INBOX(미분류) */
  .inbox{flex:0 0 178px; position:relative; border:1px dashed var(--hair);
    border-radius:var(--r-lg); background:var(--elevated)}

  /* 2×2 */
  .matrix{flex:1; min-width:0; position:relative}
  .grid{position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
  .cell{position:relative; border:1px solid var(--border); transition:background .16s}
  .cell.q1{border-top-left-radius:var(--r-lg)} .cell.q2{border-top-right-radius:var(--r-lg)}
  .cell.q3{border-bottom-left-radius:var(--r-lg)} .cell.q4{border-bottom-right-radius:var(--r-lg)}
  .cell .clabel{position:absolute; top:12px; left:14px; pointer-events:none; display:flex; gap:7px; align-items:center; flex-wrap:wrap}
  .cell .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  .cell .en{font:700 10px var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink)}
  .cell .ko{font:500 11px var(--font-body); color:var(--muted)}
  .cell.drop{background:var(--elevated)}
  .cell.q1.drop{background:rgba(255,119,89,.10)} .cell.q2.drop{background:rgba(0,60,51,.08)}
  .cell.q3.drop{background:rgba(24,99,220,.08)} .cell.q4.drop{background:rgba(147,147,159,.12)}

  /* 포스트잇 (canvas 내 absolute) */
  .postit{position:absolute; width:150px; min-height:74px; z-index:5;
    background:var(--white); border:1px solid var(--border); border-left:4px solid var(--q0);
    border-radius:var(--r-sm); padding:10px 11px 24px; cursor:grab;
    box-shadow:0 6px 16px rgba(15,20,40,.10);
    font:400 13px/1.4 var(--font-body); color:var(--ink); overflow:hidden;
    transition:left .45s cubic-bezier(.18,.9,.2,1.05), top .45s cubic-bezier(.18,.9,.2,1.05),
               transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .2s, opacity .3s;
    will-change:left,top,transform; touch-action:none}
  .postit .chip{display:inline-block; margin-bottom:5px; font:700 9px var(--font-mono);
    letter-spacing:.06em; text-transform:uppercase; padding:1px 7px; border-radius:999px}
  .chip-personal{background:var(--pale-blue); color:var(--blue)}
  .chip-work{background:var(--pale-green); color:var(--green)}
  .postit .menu-btn{position:absolute; top:4px; right:5px; width:20px;height:20px; border:none;
    background:transparent; color:var(--muted); cursor:pointer; border-radius:5px;
    font:700 14px/1 var(--font-mono); opacity:0; transition:opacity .15s,background .15s}
  .postit:hover .menu-btn,.postit.sel .menu-btn{opacity:1}
  .postit .menu-btn:hover{background:var(--stone); color:var(--ink)}
  .postit.dragging{cursor:grabbing; box-shadow:0 16px 34px rgba(15,20,40,.26);
    transition:transform .1s, box-shadow .2s; z-index:50}
  .postit.sel{outline:2px solid var(--blue); outline-offset:2px}
  .postit.q1{border-left-color:var(--q1)} .postit.q2{border-left-color:var(--q2)}
  .postit.q3{border-left-color:var(--q3)} .postit.q4{border-left-color:var(--q4)}
  .postit.pop{animation:pop .34s cubic-bezier(.2,.9,.25,1.2)}
  @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1)}}

  /* 우측 실행 컬럼 */
  .execute{flex:0 0 250px; display:flex; flex-direction:column; gap:14px; min-height:0}
  .panelbox{flex:1; min-height:0; display:flex; flex-direction:column;
    border:1px solid var(--border); border-radius:var(--r-lg); background:var(--white); overflow:hidden}
  .panelbox.drop{background:var(--pale-blue); border-color:var(--blue)}
  .pb-head{display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px 9px; border-bottom:1px solid var(--border)}
  .pb-head .lbl{font:700 10px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink)}
  .pb-head .sub{font:400 10px var(--font-mono); color:var(--muted)}
  .pb-head .add{border:1px solid var(--border); background:var(--white); cursor:pointer;
    font:500 11px var(--font-body); color:var(--ink); padding:3px 9px; border-radius:999px}
  .pb-head .add:hover{background:var(--stone)}
  .pb-body{flex:1; overflow-y:auto; padding:8px}

  /* 리스트 항목 (today / routines) */
  .item{display:flex; align-items:flex-start; gap:9px; padding:9px 10px; border-radius:var(--r-sm);
    transition:background .15s}
  .item:hover{background:var(--elevated)}
  .item .cb{flex:0 0 auto; width:17px;height:17px; margin-top:1px; border:1.5px solid var(--hair);
    border-radius:5px; cursor:pointer; display:grid; place-items:center; transition:.15s}
  .item .cb:hover{border-color:var(--slate)}
  .item.done .cb{background:var(--green); border-color:var(--green)}
  .item .cb svg{width:11px;height:11px; stroke:#fff; stroke-width:3; fill:none; opacity:0}
  .item.done .cb svg{opacity:1}
  .item .body{flex:1; min-width:0}
  .item .ttl{font:400 13px/1.35 var(--font-body); color:var(--ink)}
  .item.done .ttl{color:var(--muted); text-decoration:line-through}
  .item .meta{display:flex; gap:6px; align-items:center; margin-top:4px; flex-wrap:wrap}
  .badge{font:700 9px var(--font-mono); padding:1px 6px; border-radius:999px; letter-spacing:.04em}
  .b-q1{background:rgba(255,119,89,.14); color:#c4502f}
  .b-q2{background:var(--pale-green); color:var(--green)}
  .b-q3{background:var(--pale-blue); color:var(--blue)}
  .b-q4{background:var(--stone); color:var(--slate)}
  .b-age{background:var(--elevated); color:var(--slate); border:1px solid var(--border)}
  .b-age.old{background:rgba(255,119,89,.12); color:#c4502f; border-color:transparent}
  .b-sched{background:var(--stone); color:var(--slate)}
  .b-tag{font:600 9px var(--font-body); padding:1px 6px; border-radius:999px}
  .empty{padding:18px 12px; text-align:center; font:400 12px var(--font-body); color:var(--muted)}

  /* 루틴 추가 폼 */
  .rform{padding:8px 10px 4px; border-bottom:1px dashed var(--hair); display:none}
  .rform.open{display:block}
  .rform input{width:100%; border:1px solid var(--border); border-radius:var(--r-sm);
    padding:6px 8px; font:400 13px var(--font-body); outline:none; margin-bottom:6px}
  .rform input:focus{border-color:var(--blue)}
  .days{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px}
  .day{width:26px;height:26px; border:1px solid var(--border); background:var(--white); border-radius:7px;
    font:600 11px var(--font-body); color:var(--slate); cursor:pointer}
  .day.on{background:var(--near); color:#fff; border-color:var(--near)}
  .rform .row{display:flex; gap:8px; align-items:center; justify-content:space-between}
  .rform .daily{font:400 12px var(--font-body); color:var(--slate); display:flex; gap:5px; align-items:center; cursor:pointer}
  .rform .save{border:none; background:var(--near); color:#fff; cursor:pointer;
    font:500 12px var(--font-body); padding:5px 14px; border-radius:999px}

  /* 하단 캡처 패널 */
  .capture{flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin:0 16px 16px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--r-lg);
    background:var(--white); box-shadow:0 10px 30px rgba(10,14,30,.08)}
  .capture .bd{font:700 10px var(--font-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--coral)}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; flex:0 0 auto}
  .seg button{border:none; background:transparent; cursor:pointer; padding:6px 13px;
    font:600 12px var(--font-body); color:var(--muted)}
  .seg button.on[data-kind=personal]{background:var(--pale-blue); color:var(--blue)}
  .seg button.on[data-kind=work]{background:var(--pale-green); color:var(--green)}
  .capture input.dump{flex:1; min-width:160px; border:none; outline:none; background:transparent;
    font:400 16px var(--font-body); color:var(--ink); padding:6px 2px}
  .capture input.dump::placeholder{color:var(--muted)}
  .capture .send{border:none; cursor:pointer; background:var(--near); color:#fff;
    font:500 14px var(--font-body); padding:9px 20px; border-radius:999px}
  .capture .send:hover{background:#000}

  /* 카드 액션 메뉴 */
  .card-menu{position:fixed; z-index:80; min-width:170px; background:#fff; border:1px solid var(--border);
    border-radius:var(--r-md); box-shadow:0 16px 40px rgba(10,14,30,.22); padding:6px; display:none}
  .card-menu.open{display:block}
  .card-menu button{display:flex; width:100%; justify-content:space-between; gap:10px; border:none;
    background:transparent; cursor:pointer; text-align:left; padding:8px 10px; border-radius:var(--r-sm);
    font:400 13px var(--font-body); color:var(--ink)}
  .card-menu button:hover{background:var(--stone)}
  .card-menu small{color:var(--muted); font:400 11px var(--font-mono)}
  .card-menu .sep{height:1px; background:var(--border); margin:5px 4px}

  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px);
    background:var(--near); color:#fff; padding:9px 16px; border-radius:999px;
    font:500 13px var(--font-body); opacity:0; pointer-events:none; z-index:95; transition:.25s; white-space:nowrap}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ── 반응형 ── */
  .matrix{min-width:440px}
  @media (max-width:1180px){
    .inbox{flex-basis:152px}
    .execute{flex-basis:224px}
  }
  @media (max-width:900px){
    .matrix{min-width:0}
    .board{flex-direction:column; overflow-y:auto}
    .canvas{flex-direction:column; min-height:520px}
    .inbox{flex:0 0 150px}
    .matrix{flex:0 0 360px}
    .execute{flex:0 0 auto; flex-direction:row}
    .head .hint{display:none}
  }
  @media (max-width:560px){
    .execute{flex-direction:column}
    .capture .bd{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <span class="mark">◎ Work Radar / Capture</span>
    <span class="hint">드래그로 분류 · <b>1 2 3 4</b> 사분면 · <b>T</b> Today · 카드 ⋯ 메뉴 · 우측 패널로 드래그=Today</span>
  </div>

  <div class="board" id="board">
    <!-- 좌 + 중앙 = 캔버스 -->
    <div class="canvas" id="canvas">
      <div class="inbox" id="z-unclassified" data-zone="unclassified">
        <div class="col-label"><span class="tag">Inbox</span><span class="ko">미분류</span><span class="count" id="c-unclassified">0</span></div>
      </div>
      <div class="matrix">
        <div class="grid">
          <div class="cell q1" id="z-q1" data-zone="q1"><div class="clabel"><span class="dot" style="background:var(--q1)"></span><span class="en">Q1 · Do Now</span><span class="ko">긴급·중요</span></div></div>
          <div class="cell q2" id="z-q2" data-zone="q2"><div class="clabel"><span class="dot" style="background:var(--q2)"></span><span class="en">Q2 · Schedule</span><span class="ko">안급·중요</span></div></div>
          <div class="cell q3" id="z-q3" data-zone="q3"><div class="clabel"><span class="dot" style="background:var(--q3)"></span><span class="en">Q3 · Quick</span><span class="ko">긴급·안중요</span></div></div>
          <div class="cell q4" id="z-q4" data-zone="q4"><div class="clabel"><span class="dot" style="background:var(--q4)"></span><span class="en">Q4 · Drop</span><span class="ko">안급·안중요</span></div></div>
        </div>
      </div>
    </div>

    <!-- 우 = 실행 (Today 위 / Routines 아래) -->
    <div class="execute">
      <div class="panelbox" id="today-panel" data-drop="today">
        <div class="pb-head"><span class="lbl">Today</span><span class="sub" id="today-date">오늘</span></div>
        <div class="pb-body" id="today-list"></div>
      </div>
      <div class="panelbox" id="routines-panel">
        <div class="pb-head"><span class="lbl">Routines</span><button class="add" id="r-add">+ 루틴</button></div>
        <form class="rform" id="r-form">
          <input id="r-title" type="text" placeholder="루틴 제목 (예: 아침 운동)" autocomplete="off" />
          <div class="days" id="r-days"></div>
          <div class="row">
            <label class="daily"><input type="checkbox" id="r-daily" checked /> 매일</label>
            <button type="submit" class="save">추가</button>
          </div>
        </form>
        <div class="pb-body" id="routines-list"></div>
      </div>
    </div>
  </div>

  <!-- 하단 캡처 -->
  <div class="capture">
    <span class="bd">Brain&nbsp;Dump</span>
    <div class="seg" id="seg">
      <button type="button" data-kind="personal">개인</button>
      <button type="button" data-kind="work" class="on">업무</button>
    </div>
    <input class="dump" id="dump" type="text" placeholder="예) '일, 데모 준비' · '개인, 원두 주문' — Enter로 톡" autocomplete="off" />
    <button class="send" id="send">붙이기</button>
  </div>
</div>

<div class="card-menu" id="cardMenu">
  <button data-act="today">Today 추가<small>T</small></button>
  <div class="sep"></div>
  <button data-act="backlog">백로그 등록<small>Notion</small></button>
  <button data-act="agenda">안건 승격<small>Notion</small></button>
  <button data-act="calendar">캘린더 등록<small>일정</small></button>
  <div class="sep"></div>
  <button data-act="done">완료<small>D</small></button>
  <button data-act="archive">보관<small>E</small></button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const zones = ['unclassified','q1','q2','q3','q4'];
  const zoneEl = Object.fromEntries(zones.map(z => [z, $('z-'+z)]));
  const dump = $('dump');
  const cards = [];
  let selected = null, pendingKind = 'work';
  const CW = 150, CH = 92, GAP = 12;

  const rectIn = (el) => { const o=canvas.getBoundingClientRect(), r=el.getBoundingClientRect();
    return {x:r.left-o.left, y:r.top-o.top, w:r.width, h:r.height}; };
  const check = () => { const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d','M2 6l3 3 5-6');
    s.appendChild(p); return s; };

  // ── 태그 파서 ──
  const PERSONAL=['개인','내','나','사적','personal','p'], WORK=['업무','일','회사','직장','work','w'];
  function parseDump(raw){
    const m=raw.match(/^\s*([^\s,]+)\s*[,\s]\s*(.+)$/);
    if(m){ const h=m[1], l=h.toLowerCase();
      if(PERSONAL.includes(h)||PERSONAL.includes(l)) return {kind:'personal', text:m[2].trim()};
      if(WORK.includes(h)||WORK.includes(l)) return {kind:'work', text:m[2].trim()}; }
    return {kind:null, text:raw.trim()};
  }

  // ── 포스트잇 ──
  function makeCard(text, kind, zone='unclassified', quadrant=null, pop=false){
    const el=document.createElement('div');
    el.className='postit'+(quadrant?' '+quadrant:'');
    if(kind){ const c=document.createElement('span'); c.className='chip '+(kind==='work'?'chip-work':'chip-personal');
      c.textContent=kind==='work'?'업무':'개인'; el.appendChild(c); }
    const b=document.createElement('div'); b.className='body'; b.textContent=text; el.appendChild(b);
    const mb=document.createElement('button'); mb.className='menu-btn'; mb.type='button'; mb.textContent='⋯'; el.appendChild(mb);
    canvas.appendChild(el);
    const card={el, zone:quadrant||zone, text, kind:kind||null};
    cards.push(card); bindDrag(card);
    mb.addEventListener('pointerdown', e=>e.stopPropagation());
    mb.addEventListener('click', e=>{ e.stopPropagation(); openMenu(card, mb); });
    el.addEventListener('mousedown', ()=>select(card));
    if(pop){ el.classList.add('pop'); el.addEventListener('animationend',()=>el.classList.remove('pop'),{once:true}); }
    return card;
  }
  function layout(zone, anim){
    const list=cards.filter(c=>c.zone===zone); const z=rectIn(zoneEl[zone]);
    if(zone==='unclassified'){
      const cols=Math.max(1, Math.floor((z.w-24)/(CW+GAP)));
      if(cols<=1){ const top=z.y+40, bot=z.y+z.h-CH-8, step=list.length>1?Math.min(58,(bot-top)/(list.length-1)):0;
        list.forEach((c,i)=>place(c, z.x+16+(i%2)*12, top+i*step, (i%2?2:-2), anim, i)); }
      else list.forEach((c,i)=>{const col=i%cols,row=(i/cols)|0; place(c, z.x+14+col*(CW+GAP), z.y+40+row*(CH+GAP), 0, anim, i);});
      return;
    }
    const cols=Math.max(1, Math.floor((z.w-28)/(CW+GAP)));
    list.forEach((c,i)=>{const col=i%cols,row=(i/cols)|0; place(c, z.x+14+col*(CW+GAP), z.y+38+row*(CH+GAP), 0, false, i);});
  }
  function place(card,x,y,rot,fromOrigin,i){
    const el=card.el;
    if(fromOrigin){ const o=canvas.getBoundingClientRect();
      el.style.transition='none'; el.style.left=(o.width/2-CW/2)+'px'; el.style.top=(o.height-40)+'px';
      el.style.transform='scale(.34)'; el.style.opacity='0'; el.getBoundingClientRect();
      setTimeout(()=>{ el.style.transition=''; el.style.left=x+'px'; el.style.top=y+'px';
        el.style.transform=`rotate(${rot||0}deg)`; el.style.opacity='1'; }, 70+i*80);
    } else { el.style.left=x+'px'; el.style.top=y+'px'; el.style.transform=`rotate(${rot||0}deg)`; el.style.opacity='1'; }
  }
  function assign(card, zone){ const old=card.zone; card.zone=zone;
    card.el.classList.remove('q1','q2','q3','q4'); if(zone!=='unclassified') card.el.classList.add(zone);
    layout(old); layout(zone); counts(); }
  function select(card){ if(selected) selected.el.classList.remove('sel'); selected=card; card.el.classList.add('sel'); }
  function counts(){ $('c-unclassified').textContent=cards.filter(c=>c.zone==='unclassified').length; }

  // ── 드래그 (캔버스 내 분류 + 우측 패널로 Today 승격) ──
  function bindDrag(card){ const el=card.el; let ox,oy,moved;
    el.addEventListener('pointerdown', e=>{ if(e.target.closest('.menu-btn')) return;
      moved=false; select(card); const r=el.getBoundingClientRect();
      ox=e.clientX-r.left; oy=e.clientY-r.top; el.setPointerCapture(e.pointerId);
      el.classList.add('dragging'); el.style.transition='none'; el.style.transform='rotate(0deg)';
      const move=ev=>{ moved=true; const o=canvas.getBoundingClientRect();
        el.style.left=(ev.clientX-o.left-ox)+'px'; el.style.top=(ev.clientY-o.top-oy)+'px'; hi(ev.clientX,ev.clientY); };
      const up=ev=>{ el.releasePointerCapture(e.pointerId); el.removeEventListener('pointermove',move);
        el.removeEventListener('pointerup',up); el.classList.remove('dragging'); el.style.transition=''; clearHi();
        if(!moved){ layout(card.zone); return; }
        const tp=$('today-panel').getBoundingClientRect();
        if(ev.clientX>=tp.left&&ev.clientX<=tp.right&&ev.clientY>=tp.top&&ev.clientY<=tp.bottom){ promoteToday(card); return; }
        const z=zoneAt(ev.clientX,ev.clientY); assign(card, z||card.zone); };
      el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
    });
  }
  function zoneAt(cx,cy){ for(const z of zones){ const r=zoneEl[z].getBoundingClientRect();
    if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom) return z; } return null; }
  let hiEl=null, hiToday=false;
  function hi(cx,cy){ clearHi(); const tp=$('today-panel');
    const r=tp.getBoundingClientRect();
    if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom){ tp.classList.add('drop'); hiToday=true; return; }
    const z=zoneAt(cx,cy); if(z&&z!=='unclassified'){ hiEl=zoneEl[z]; hiEl.classList.add('drop'); } }
  function clearHi(){ if(hiEl){hiEl.classList.remove('drop');hiEl=null;} if(hiToday){$('today-panel').classList.remove('drop');hiToday=false;} }

  // ── Today ──
  const todayItems=[];
  function renderToday(){
    const list=$('today-list'); list.textContent='';
    if(!todayItems.length){ const e=document.createElement('div'); e.className='empty';
      e.textContent='매트릭스 카드를 여기로 드래그하거나 ⋯ → Today 추가'; list.appendChild(e); return; }
    todayItems.forEach(it=>{
      const row=document.createElement('div'); row.className='item'+(it.done?' done':'');
      const cb=document.createElement('div'); cb.className='cb'; cb.appendChild(check());
      cb.addEventListener('click',()=>{ it.done=!it.done; renderToday(); });
      const body=document.createElement('div'); body.className='body';
      const t=document.createElement('div'); t.className='ttl'; t.textContent=it.text;
      const meta=document.createElement('div'); meta.className='meta';
      if(it.quadrant){ const q=document.createElement('span'); q.className='badge b-'+it.quadrant;
        q.textContent=it.quadrant.toUpperCase(); meta.appendChild(q); }
      const age=document.createElement('span'); age.className='badge b-age'+(it.age>=3?' old':''); age.textContent='+'+it.age; meta.appendChild(age);
      if(it.kind){ const k=document.createElement('span'); k.className='b-tag '+(it.kind==='work'?'chip-work':'chip-personal');
        k.textContent=it.kind==='work'?'업무':'개인'; meta.appendChild(k); }
      body.appendChild(t); body.appendChild(meta); row.appendChild(cb); row.appendChild(body); list.appendChild(row);
    });
  }
  function promoteToday(card, silent){
    const q=zones.includes(card.zone)&&card.zone!=='unclassified'?card.zone:null;
    todayItems.unshift({text:card.text, quadrant:q, kind:card.kind, age:1, done:false});
    const i=cards.indexOf(card); if(i>=0) cards.splice(i,1);
    const z=card.zone; card.el.style.transition='transform .2s,opacity .2s';
    card.el.style.transform='scale(.6)'; card.el.style.opacity='0'; setTimeout(()=>card.el.remove(),200);
    if(selected===card) selected=null; layout(z); counts(); renderToday();
    if(!silent) toast('Today 추가 (로컬)');
  }

  // ── Routines ──
  const DAYS=['월','화','수','목','금','토','일'];
  const routines=[
    {title:'아침 운동', daily:true, days:[], done:false},
    {title:'주간 회고', daily:false, days:[4], done:false},
    {title:'팀 스탠드업', daily:false, days:[0,2,4], done:false},
    {title:'가계부 정리', daily:false, days:[6], done:true},
  ];
  function schedLabel(r){ return r.daily ? '매일' : r.days.map(d=>DAYS[d]).join('·'); }
  function renderRoutines(){
    const list=$('routines-list'); list.textContent='';
    routines.forEach(r=>{
      const row=document.createElement('div'); row.className='item'+(r.done?' done':'');
      const cb=document.createElement('div'); cb.className='cb'; cb.appendChild(check());
      cb.addEventListener('click',()=>{ r.done=!r.done; renderRoutines(); });
      const body=document.createElement('div'); body.className='body';
      const t=document.createElement('div'); t.className='ttl'; t.textContent=r.title;
      const meta=document.createElement('div'); meta.className='meta';
      const s=document.createElement('span'); s.className='badge b-sched'; s.textContent=schedLabel(r); meta.appendChild(s);
      body.appendChild(t); body.appendChild(meta); row.appendChild(cb); row.appendChild(body); list.appendChild(row);
    });
  }
  // 루틴 추가 폼
  const dayState=[false,false,false,false,false,false,false];
  function buildDayBtns(){ const wrap=$('r-days'); DAYS.forEach((d,i)=>{ const b=document.createElement('button');
    b.type='button'; b.className='day'; b.textContent=d;
    b.addEventListener('click',()=>{ dayState[i]=!dayState[i]; b.classList.toggle('on',dayState[i]);
      if(dayState[i]){ $('r-daily').checked=false; } }); wrap.appendChild(b); }); }
  $('r-add').addEventListener('click',()=>{ $('r-form').classList.toggle('open'); $('r-title').focus(); });
  $('r-daily').addEventListener('change',()=>{ if($('r-daily').checked){ dayState.fill(false);
    document.querySelectorAll('#r-days .day').forEach(b=>b.classList.remove('on')); } });
  $('r-form').addEventListener('submit', e=>{ e.preventDefault();
    const title=$('r-title').value.trim(); if(!title) return;
    const daily=$('r-daily').checked || !dayState.some(Boolean);
    const days=dayState.map((on,i)=>on?i:-1).filter(i=>i>=0);
    routines.push({title, daily, days, done:false});
    $('r-title').value=''; dayState.fill(false); document.querySelectorAll('#r-days .day').forEach(b=>b.classList.remove('on'));
    $('r-daily').checked=true; $('r-form').classList.remove('open'); renderRoutines(); toast('루틴 추가'); });

  // ── 카드 메뉴 ──
  const menu=$('cardMenu'); let menuCard=null;
  const ACT={backlog:'백로그 등록',agenda:'안건 승격',calendar:'캘린더 등록'};
  function openMenu(card, anchor){ menuCard=card; select(card); menu.classList.add('open');
    const r=anchor.getBoundingClientRect(); const mw=menu.offsetWidth||172, mh=menu.offsetHeight||230;
    menu.style.left=Math.min(r.right-mw, innerWidth-mw-8)+'px'; menu.style.top=Math.min(r.bottom+6, innerHeight-mh-8)+'px'; }
  function closeMenu(){ menu.classList.remove('open'); menuCard=null; }
  function doAct(a){ if(!menuCard) return; const c=menuCard;
    if(a==='today') promoteToday(c);
    else if(a==='done'){ removeCard(c); toast('완료'); }
    else if(a==='archive'){ removeCard(c); toast('보관'); }
    else toast(`${ACT[a]} — Acceptance 대기`); closeMenu(); }
  function removeCard(c){ const i=cards.indexOf(c); if(i>=0) cards.splice(i,1); const z=c.zone;
    c.el.style.transition='transform .2s,opacity .2s'; c.el.style.transform='scale(.6)'; c.el.style.opacity='0';
    setTimeout(()=>c.el.remove(),200); if(selected===c) selected=null; layout(z); counts(); }
  menu.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) doAct(b.dataset.act); });
  menu.addEventListener('pointerdown', e=>e.stopPropagation());
  window.addEventListener('pointerdown', e=>{ if(!e.target.closest('.card-menu')&&!e.target.closest('.menu-btn')) closeMenu(); });

  // ── 토글 / 캡처 / 키보드 ──
  const seg=$('seg');
  seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ pendingKind=b.dataset.kind;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
  function submit(){ const raw=dump.value; if(!raw.trim()) return; const {kind,text}=parseDump(raw);
    if(!text) return; const c=makeCard(text, kind||pendingKind, 'unclassified', null, true);
    dump.value=''; layout('unclassified'); counts(); select(c); }
  dump.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  $('send').addEventListener('click', submit);
  window.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeMenu(); return; }
    if(document.activeElement===dump||document.activeElement===$('r-title')) return; if(!selected) return;
    const m={'1':'q1','2':'q2','3':'q3','4':'q4','0':'unclassified','u':'unclassified'};
    if(m[e.key]){ assign(selected,m[e.key]); e.preventDefault(); return; }
    if(e.key.toLowerCase()==='t'){ promoteToday(selected); e.preventDefault(); }
    else if(e.key.toLowerCase()==='d'||e.key.toLowerCase()==='e'){ removeCard(selected); e.preventDefault(); } });

  let tT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
    clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),1700); }

  // ── 시드 / 부트 ──
  function boot(){
    // 미분류
    [['히어로 카피 톤 다시 잡기','work'],['readme 스크린샷 교체','work'],['커피 원두 주문','personal']]
      .forEach(([t,k])=>makeCard(t,k,'unclassified'));
    // 분류된 카드
    makeCard('PR #128 CI 빨강 추적','work','q1','q1'); makeCard('결제 플로우 결정','work','q1','q1');
    makeCard('온보딩 문구 다듬기','work','q2','q2'); makeCard('세금계산서 확인','personal','q3','q3');
    layout('unclassified', true); ['q1','q2','q3','q4'].forEach(z=>layout(z)); counts();
    // Today 시드 (경과일 데모)
    todayItems.push({text:'금요일 데모 리허설', quadrant:'q1', kind:'work', age:1, done:false});
    todayItems.push({text:'Notion 백로그 stale 정리', quadrant:'q2', kind:'work', age:3, done:false});
    renderToday();
    const d=new Date(); $('today-date').textContent=`${d.getMonth()+1}/${d.getDate()} 오늘`;
    buildDayBtns(); renderRoutines();
  }
  window.addEventListener('load', ()=>setTimeout(boot,120));
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>zones.forEach(z=>layout(z)),90); });
})();
</script>
</body>
