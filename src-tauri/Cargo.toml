[package]
name = "work-radar"
version = "0.1.0"
description = "Work Radar — Eisenhower 매트릭스 기반 업무 관제 데스크톱 앱"
authors = ["Work Radar"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows linker issue).
name = "work_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 트레이 상주 셸(Phase 13) — TrayIconBuilder가 이 feature를 요구한다.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# "Notion에서 열기" 딥링크(생성된 페이지 URL 오픈). 토큰과 무관, read-only 외부 열기.
tauri-plugin-opener = "2"
# 백그라운드 스케줄러가 발사하는 네이티브 알림(Phase 13). 권한 요청/체크 플로우 포함.
tauri-plugin-notification = "2"
# 폴더 picker(Phase 14): repo local_path 등 경로 입력을 OS 다이얼로그로 통일(붙여넣기 제거).
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
# 잡 kill switch(CancellationToken). architecture §5가 명시한 취소 프리미티브 (Phase 7).
tokio-util = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# 토큰은 OS keychain에만 (INVARIANT: SQLite 평문/렌더러 노출 금지).
keyring = { version = "3", features = ["apple-native"] }

# 외부 호출은 Rust에 둔다 (토큰 렌더러 노출 금지 — INVARIANT).
#   Notion = reqwest REST(GET /v1/users/me ping), GitHub = octocrab(current user ping).
#   rustls-tls로 통일 (openssl 시스템 의존 회피). octocrab 기본 features도 rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
octocrab = "0.42"

# PR Radar(Phase 4): age/stale 날짜연산.
#   chrono는 octocrab가 이미 transitive로 쓰므로 빌드 비용 추가 없음(clock = Utc::now()).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Google Calendar OAuth(Phase 10a): PKCE(S256) code_challenge + base64url 인코딩 + CSPRNG.
#   모두 reqwest/rustls가 이미 transitive로 끌어오는 크레이트라 빌드 비용 최소.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# IPC 타입 계약: Rust 타입 → TS 생성 (수기 타입 중복 금지).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# 구조적·레벨별 로깅(에러처리 정본 설계). errors.log=WARN+, app.log=INFO+, stdout=EnvFilter.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 파일 appender(일별 회전 + max_log_files로 bound). non-blocking writer.
tracing-appender = "0.2"
# 도메인 에러 enum의 Display/Error boilerplate 정리(컴파일타임 전용).
thiserror = "2"

# TTL + bounded(max_capacity) 캐시(P6). 외부 HTTP *읽기* 가속 전용 — 결정/escalation/accept
# 레일 무침투(INVARIANT #2/#4/#7). future::Cache는 clone으로 공유(Arc<Mutex> 금지).
moka = { version = "0.12", features = ["future"] }
async-trait = "0.1.89"
feed-rs = "2.3.1"
# 뉴스 피드 title/summary의 HTML 엔티티(`&amp;`, `&#39;`, 숫자 엔티티 등)를 ingest 시 1회
# decode. React는 escape만 하고 decode는 안 해 literal로 노출되므로 저장 전에 정리한다.
html-escape = "0.2.13"
rand = "0.10.1"
uuid = { version = "1", features = ["v4"] }

# 스킬 네트워크 설치(G1.5): GitHub tarball(.tar.gz)을 받아 안전 추출. flate2 기본 백엔드는
# 순수 Rust miniz_oxide(시스템 zlib/openssl 의존 없음 — rustls 일관). tempfile은 추출 임시 dir에
# 런타임으로 쓰이므로 dev가 아닌 정식 의존성으로 둔다.
flate2 = "1"
tar = "0.4"
tempfile = "3"
# 외부 AI 에이전트용 앱 내장 stdio MCP 서버(External Action Gate Phase 1, proposal-only).
# server=핸들러/툴 라우터, transport-io=stdio() 트랜스포트, macros=#[tool_router]/#[tool].
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros"] }
# rmcp 1.7의 #[tool] 매크로가 입력/출력 DTO에 schemars 1.x JsonSchema를 요구한다(버전 일치 필수 —
# schemars 0.x 파생은 rmcp 매크로와 타입 불일치로 컴파일 실패). rmcp 재수출 버전에 핀.
schemars = "1.2.1"
# `--mcp-stdio` 모드는 GUI 부팅(=tauri AppHandle) 없이 앱과 **동일한** DB 경로를 열어야 한다.
# tauri 2의 app_data_dir()는 내부적으로 `dirs::data_dir()/<bundle identifier>`이므로 동일 의미를
# 헤드리스로 재현한다(하드코딩 경로 아님 — 식별자는 tauri.conf.json 미러 const). tauri가 이미
# 트랜지티브로 끌어오는 크레이트라 빌드 비용 추가 없음.
dirs = "6"

[dev-dependencies]
# 로테이션 단위 테스트용 임시 디렉터리.
tempfile = "3"
# tokio::time::pause/advance/start_paused — fetcher 단위 테스트에서 시간 제어.
tokio = { version = "1", features = ["test-util"] }
# compile-fail 테스트(Task 1.0): external_actions 밖에서 `Acceptance::mint` 호출이
# 컴파일 실패함을 잠근다 — MCP 모듈이 같은 crate라도 토큰 위조 불가(type-wall 증명).
trybuild = "1"

[features]
# default Tauri custom-protocol toggle used by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
