[package]
name = "work-radar"
version = "0.1.0"
description = "Work Radar — Eisenhower 매트릭스 기반 업무 관제 데스크톱 앱"
authors = ["Work Radar"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows linker issue).
name = "work_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 트레이 상주 셸(Phase 13) — TrayIconBuilder가 이 feature를 요구한다.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# "Notion에서 열기" 딥링크(생성된 페이지 URL 오픈). 토큰과 무관, read-only 외부 열기.
tauri-plugin-opener = "2"
# 백그라운드 스케줄러가 발사하는 네이티브 알림(Phase 13). 권한 요청/체크 플로우 포함.
tauri-plugin-notification = "2"
# 폴더 picker(Phase 14): repo local_path 등 경로 입력을 OS 다이얼로그로 통일(붙여넣기 제거).
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
# 잡 kill switch(CancellationToken). architecture §5가 명시한 취소 프리미티브 (Phase 7).
tokio-util = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# 토큰은 OS keychain에만 (INVARIANT: SQLite 평문/렌더러 노출 금지).
keyring = { version = "3", features = ["apple-native"] }

# 외부 호출은 Rust에 둔다 (토큰 렌더러 노출 금지 — INVARIANT).
#   Notion = reqwest REST(GET /v1/users/me ping), GitHub = octocrab(current user ping).
#   rustls-tls로 통일 (openssl 시스템 의존 회피). octocrab 기본 features도 rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
octocrab = "0.42"

# PR Radar(Phase 4): ticketKeyPattern 매칭 + age/stale 날짜연산.
#   chrono는 octocrab가 이미 transitive로 쓰므로 빌드 비용 추가 없음(clock = Utc::now()).
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Google Calendar OAuth(Phase 10a): PKCE(S256) code_challenge + base64url 인코딩 + CSPRNG.
#   모두 reqwest/rustls가 이미 transitive로 끌어오는 크레이트라 빌드 비용 최소.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# IPC 타입 계약: Rust 타입 → TS 생성 (수기 타입 중복 금지).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[features]
# default Tauri custom-protocol toggle used by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
