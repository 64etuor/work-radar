# CI 비활성화 (2026-06-23): GitHub Actions 사용량 소진 + Rust 잡이 러너 디스크 부족
# (No space left on device — gtk 컴파일 중)으로 전 커밋 빨강 → 무의미한 실행/노이즈 차단.
# 자동 실행 안 함 (on: workflow_dispatch + if:false noop). 아래 원본은 전체 주석.
# 복구: 아래 "# " 주석을 제거해 원본을 되살리고, 디스크 부족은 Rust 잡 맨 앞에
#       free-disk-space 스텝(android/dotnet 등 프리설치 제거 ~10GB+)을 추가하면 통과한다.
name: CI (disabled)
on:
  workflow_dispatch:
jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "echo 'CI temporarily disabled'"

