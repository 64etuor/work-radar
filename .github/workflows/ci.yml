name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# push("**")와 pull_request("**")가 같은 커밋에 둘 다 걸려 중복 실행되므로,
# ref 단위로 묶고 진행 중 실행은 취소해 러너 낭비를 막는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # cargo test가 src/bindings.ts를 재생성한다(lib.rs bindings_export 테스트).
      # 커밋된 바인딩이 stale이면 여기서 diff가 떠 머지를 막는다(tauri-specta INVARIANT).
      - name: Verify generated TS bindings are committed
        run: |
          if ! git diff --exit-code src/bindings.ts; then
            echo "::error::src/bindings.ts가 최신이 아닙니다. 'cargo test' 후 재생성된 바인딩을 커밋하세요." >&2
            exit 1
          fi

  frontend:
    name: Frontend (typecheck / build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
