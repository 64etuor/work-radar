name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # INVARIANT: IPC 타입은 tauri-specta 자동 생성 — 수기 중복/drift 금지.
      # cargo test 가 src/bindings.ts 를 재생성하므로, 커밋된 생성물이 최신인지 확인.
      - name: bindings.ts drift 체크
        run: |
          if ! git diff --exit-code -- src/bindings.ts; then
            echo "✋ src/bindings.ts 가 Rust 소스와 어긋났습니다 (stale)."
            echo "   'cargo test --manifest-path src-tauri/Cargo.toml' 후 src/bindings.ts 를 커밋하세요."
            exit 1
          fi

  guards:
    name: Guards (INVARIANTS / doc budgets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: INVARIANT 구조 게이트
        run: bash scripts/check-invariants.sh

      - name: 문서 라인 버짓
        run: bash scripts/check-doc-budgets.sh

  frontend:
    name: Frontend (typecheck / build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
