name: Windows compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify cross-platform Tauri launcher
        run: node --test scripts/tauri-wrapper.test.mjs

      - name: Verify frontend
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Verify Rust
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 테스트 exe에는 tauri-build 매니페스트(rustc-link-arg-bins)가 안 붙어 comctl32 v6
          # 미선언 → STATUS_ENTRYPOINT_NOT_FOUND. 외부 manifest(<exe>.manifest)로 보완한다
          # (임베디드 매니페스트가 없을 때만 로더가 읽으므로 bin과 충돌 없음).
          # 참조: https://github.com/orgs/tauri-apps/discussions/11179
          Get-ChildItem src-tauri/target/debug/deps -Filter *.exe | ForEach-Object {
            Copy-Item src-tauri/windows-app-manifest.xml "$($_.FullName).manifest"
          }
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build Windows app
        run: pnpm tauri build --debug --no-bundle

      - name: Verify generated bindings are committed
        run: git diff --exit-code -- src/bindings.ts
