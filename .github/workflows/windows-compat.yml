name: Windows compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify cross-platform Tauri launcher
        run: node --test scripts/tauri-wrapper.test.mjs

      - name: Verify frontend
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Verify Rust
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build Windows app
        run: pnpm tauri build --debug --no-bundle

      - name: Verify generated bindings are committed
        run: git diff --exit-code -- src/bindings.ts
